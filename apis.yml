aid: peony
name: Peony
description: >-
  Peony is a virtual data room (VDR) platform for secure document sharing,
  page-level analytics, due diligence workflows, AI-powered Q&A, and legally
  binding e-signatures. Founded in 2021 by Deqian Jia and headquartered in San
  Francisco with a London office, Peony positions itself as a design-led,
  premium alternative to legacy VDR vendors such as DocSend, Datasite, Firmex,
  Digify, and Ideals. The platform offers NDA-gated access, dynamic
  viewer-identity watermarks, screenshot protection, granular permissions,
  custom-domain delivery, AI document extraction and redaction, and detailed
  audit logs. It is SOC 2 Type II certified and GDPR, CCPA, and HIPAA compliant,
  serving 5,900+ teams including YC startups, M&A advisors, and funds managing
  over $19.6B in assets.
